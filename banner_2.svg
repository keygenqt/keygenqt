<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 980 300" role="img"
  aria-label="keygenqt profile banner" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest>
      </c2pa:manifest>
  </metadata>
  <!--
    ============ ЧТО МЕНЯТЬ ============
    Числа статистики: ищи комментарий "EDIT: stats" (repos / stars / followers).
    Языки: комментарий "EDIT: languages". Ширина полоски = процент * 1.8
    (например 60% -> width="108"), сам процент — в тексте справа.
    ====================================
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#1a1230" />
    </linearGradient>
    <linearGradient id="rust" x1="0" x2="1">
      <stop offset="0" stop-color="#f74c00" />
      <stop offset="1" stop-color="#ffb86c" />
    </linearGradient>
    <linearGradient id="kotlin" x1="0" x2="1">
      <stop offset="0" stop-color="#7f52ff" />
      <stop offset="1" stop-color="#e44857" />
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; }
    .code { font-size: 19px; fill: #c9d1d9; }
    .kw { fill: #ff7b72; }
    .ty { fill: #ffa657; }
    .str { fill: #a5d6ff; }
    .num { fill: #79c0ff; font-weight: bold; }
    .cm { fill: #6e7681; font-size: 15px; }
    .lbl { font-size: 16px; fill: #c9d1d9; }
    .pct { font-size: 14px; fill: #8b949e; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="980" height="300" rx="14" fill="url(#bg)" stroke="#30363d" />
  <path d="M10 24a14 14 0 0 1 14-14h952a14 14 0 0 1 14 14v32H10z" fill="#161b22" />
  <circle cx="36" cy="33" r="6" fill="#ff5f56" />
  <circle cx="58" cy="33" r="6" fill="#ffbd2e" />
  <circle cx="80" cy="33" r="6" fill="#27c93f" />
  <text x="500" y="38" text-anchor="middle" class="cm">keygenqt.rs</text>
  <line x1="600" y1="80" x2="600" y2="290" stroke="#30363d" />

  <!-- code -->
  <text x="40" y="88" class="cm">// Open Mobile Platform · Volgodonsk</text>
  <text x="40" y="118" class="code"><tspan class="kw">struct</tspan> <tspan class="ty">Developer</tspan>
    {</text>
  <text x="70" y="146" class="code">name: <tspan class="str">"Vitaliy Zarubin"</tspan>,</text>
  <text x="70" y="174" class="code">role: <tspan class="str">"Multiplatform Developer"</tspan>,</text>

  <!-- EDIT: stats -->
  <text x="70" y="202" class="code">repos: <tspan class="num">133</tspan>,</text>
  <text x="70" y="230" class="code">stars: <tspan class="num">244</tspan>,</text>
  <text x="70" y="258" class="code">followers: <tspan class="num">93</tspan>,</text>
  <text x="40" y="286" class="code">}<tspan class="cursor" fill="#c9d1d9" dy="-1.8" dx="2">▌</tspan></text>

  <!-- languages -->
  <text x="630" y="88" class="cm">// Tech stack</text>

  <!-- EDIT: languages -->
  <g transform="translate(630,120)">
    <text x="0" y="0" class="lbl">Rust</text>
    <rect x="100" y="-12" width="180" height="12" rx="6" fill="#21262d" />
    <rect x="100" y="-12" width="108" height="12" rx="6" fill="url(#rust)" />
    <text x="300" y="0" class="pct">60%</text>

    <text x="0" y="40" class="lbl">Kotlin</text>
    <rect x="100" y="28" width="180" height="12" rx="6" fill="#21262d" />
    <rect x="100" y="28" width="63" height="12" rx="6" fill="url(#kotlin)" />
    <text x="300" y="40" class="pct">35%</text>

    <text x="0" y="80" class="lbl">JavaScript</text>
    <rect x="100" y="68" width="180" height="12" rx="6" fill="#21262d" />
    <rect x="100" y="68" width="27" height="12" rx="6" fill="#3178c6" />
    <text x="300" y="80" class="pct">15%</text>

    <text x="0" y="120" class="lbl">Shell</text>
    <rect x="100" y="108" width="180" height="12" rx="6" fill="#21262d" />
    <rect x="100" y="108" width="18" height="12" rx="6" fill="#89e051" />
    <text x="300" y="120" class="pct">10%</text>

    <text x="0" y="160" class="lbl">Python</text>
    <rect x="100" y="148" width="180" height="12" rx="6" fill="#21262d" />
    <rect x="100" y="148" width="11" height="12" rx="6" fill="#ffd43b" />
    <text x="300" y="160" class="pct">6%</text>
  </g>
</svg>
